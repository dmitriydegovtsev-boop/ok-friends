name: windows-check

# Проверки на настоящей Windows: свёрнутое/перекрытое окно Chrome и сухой прогон на макете ОК.
# Запуск — пуш в ветку check/… (или вручную). Итоговые строки — в аннотациях запуска (видны без входа).
on:
  push:
    branches: ["check/**"]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Minimized / covered Chrome window
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          rc=0
          python tools/win_check.py 2>&1 | tee win_check.txt || rc=$?
          grep -E "^[0-9]\)|итог|ИТОГО|журнал программы" win_check.txt | head -9 | while read -r l; do echo "::notice title=win_check::$l"; done
          exit $rc

      - name: Dry run on the OK mock (all scenarios)
        if: always()
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          OKF_TEST_BASE: ${{ runner.temp }}/okf_fast_test
        run: |
          rc=0
          python tools/test_fast.py mock 2>&1 | tee test_fast.txt || rc=$?
          { grep -E "ИТОГО" test_fast.txt; grep -E "^\s*FAIL" test_fast.txt | head -8; } | while read -r l; do echo "::notice title=test_fast::$l"; done
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check-logs
          path: |
            win_check.txt
            test_fast.txt
            ${{ runner.temp }}/okf_fast_test/logs
            ${{ runner.temp }}/okf_fast_test/screenshots
